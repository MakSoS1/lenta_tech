name: Ostrovok application CI
on:
  push:
    paths: ['apps/ostrovok/**', 'Dockerfile', 'docker-compose.yml', '.dockerignore', '.env.example', '.github/workflows/ostrovok-ci.yml', 'docs/ostrovok/**']
  pull_request:
    paths: ['apps/ostrovok/**', 'Dockerfile', 'docker-compose.yml', '.github/workflows/ostrovok-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ostrovok-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  domain-api-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.10.0'
      - name: Install locked test dependencies
        run: pip install --require-hashes -r apps/ostrovok/backend/requirements-dev.lock
      - name: Verify acquired data and application behavior
        env:
          LLM_MODE: offline
        run: |
          mkdir -p reports/ostrovok
          python apps/ostrovok/scripts/validate_snapshot.py > reports/ostrovok/data-validation.json
          python -m pytest apps/ostrovok/tests -q --junitxml=reports/ostrovok/pytest.xml
          python -m unittest discover -s tests -v
          python apps/ostrovok/evals/run.py --report reports/ostrovok/offline-eval.json
      - name: Build and test the interface
        working-directory: apps/ostrovok/frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ostrovok-tests-${{ github.run_number }}
          path: reports/ostrovok/
          retention-days: 14
  docker-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.10.0'
      - name: Cold Docker build and healthcheck
        env:
          LLM_MODE: offline
        run: |
          mkdir -p reports/ostrovok
          started=$SECONDS
          docker compose up -d --build --wait --wait-timeout 180
          python -c "import json,pathlib; pathlib.Path('reports/ostrovok/cold-start.json').write_text(json.dumps({'seconds': $((SECONDS-started)), 'environment':'GitHub ubuntu-24.04', 'llm_mode':'offline'}))"
          test "$(docker compose exec -T app id -u)" = '10001'
          python apps/ostrovok/scripts/http_smoke.py
      - name: Desktop and mobile user journey
        working-directory: apps/ostrovok/e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test
      - name: Persistence after container restart
        env:
          LLM_MODE: offline
        run: |
          docker compose restart app
          docker compose up -d --wait --wait-timeout 90
          python apps/ostrovok/scripts/http_smoke.py --resume --report reports/ostrovok/restart-persistence.json
      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > reports/ostrovok/container.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ostrovok-browser-docker-${{ github.run_number }}
          path: |
            reports/ostrovok/
            apps/ostrovok/e2e/test-results/
            apps/ostrovok/e2e/playwright-report/
          retention-days: 14
      - name: Stop containers
        if: always()
        run: docker compose down
