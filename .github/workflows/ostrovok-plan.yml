name: Ostrovok plan checks

on:
  push:
    paths:
      - 'docs/ostrovok/OSTROVOK_HACKATHON_PLAN_2026-10-23.md'
      - 'scripts/check_ostrovok_plan.py'
      - '.github/workflows/ostrovok-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ostrovok-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the planning files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ostrovok/OSTROVOK_HACKATHON_PLAN_2026-10-23.md
            /scripts/check_ostrovok_plan.py

      - name: Verify document structure and scoring
        run: python3 scripts/check_ostrovok_plan.py --report plan-check-report.json

      - name: Write a precise check summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report_path = Path('plan-check-report.json')
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding='utf-8'))
              summary = (
                  '# Ostrovok planning artifact\n\n'
                  f"Status: **{report['status']}**\n\n"
                  f"Sections: {report['sections']}; concepts: {len(report['concepts'])}; "
                  f"sources: {report['sources']}; acceptance scenarios: {report['acceptance_scenarios']}.\n\n"
                  'This job validates the document, its internal references, and the scoring arithmetic. '
                  'It does not test a travel application, measure model quality, or verify external pages.\n\n'
                  f"SHA-256: `{report['sha256']}`\n"
              )
          else:
              summary = '# Ostrovok planning artifact\n\nNo report was produced. Inspect the failed step.\n'
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary, encoding='utf-8')
          PY

      - name: Upload the plan and its verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ostrovok-hackathon-plan-${{ github.run_number }}
          path: |
            docs/ostrovok/OSTROVOK_HACKATHON_PLAN_2026-10-23.md
            plan-check-report.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
