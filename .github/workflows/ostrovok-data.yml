name: Ostrovok fresh public reference data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ostrovok-data.yml'
      - 'apps/ostrovok/scripts/fetch_open_data.py'
      - 'apps/ostrovok/scripts/fetch_hotel_pois.py'
      - 'apps/ostrovok/scripts/validate_snapshot.py'
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: ostrovok-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acquire-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Acquire actual public core sources into an isolated candidate
        run: |
          mkdir -p reports/ostrovok
          python apps/ostrovok/scripts/fetch_open_data.py --output reports/ostrovok/fresh-reference 2>&1 | tee reports/ostrovok/fresh-acquisition.log
      - name: Validate acquired candidate
        if: always()
        run: |
          python apps/ostrovok/scripts/validate_snapshot.py --output reports/ostrovok/fresh-reference --write-report 2>&1 | tee reports/ostrovok/fresh-validation.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ostrovok-fresh-reference-${{ github.run_number }}
          path: reports/ostrovok/
          retention-days: 14
          if-no-files-found: warn
